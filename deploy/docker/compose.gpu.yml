# GPU 覆盖文件（可选）。
#
# 用法：
#   docker compose -f compose.yaml -f deploy/docker/compose.gpu.yml up -d --build
#
# ## 只需要声明设备
#
# 镜像按 `uv.lock` 安装，torch wheel 本身已带 CUDA 运行时；
# 关键是把 NVIDIA 设备透传进容器。只改 `RAG_EMBEDDING__DEVICE=cuda`
# 而没有 `deploy.resources.reservations.devices`，torch.cuda.is_available()
# 仍是 False，模型会直接报错。
#
# 前置条件：宿主安装 NVIDIA 驱动 + nvidia-container-toolkit，
# 且 `docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi` 可用。
#
# 显存：bge-m3 约 2GB；bge-reranker-base 约 1GB。API 与 Worker 是两个进程，
# 各加载一份模型，显存预算按两份算。

services:
  api:
    environment:
      RAG_EMBEDDING__DEVICE: "cuda"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker:
    environment:
      RAG_EMBEDDING__DEVICE: "cuda"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
