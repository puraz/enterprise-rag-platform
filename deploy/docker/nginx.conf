# 前端静态资源 + API 反向代理。
#
# 与 apps/web/vite.config.ts 的 dev proxy 保持同样的语义：
# 浏览器只看到同源，所有 /api、/health 请求转到 api:8000。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与 RAG_STORAGE__MAX_FILE_SIZE（2GB）对齐。
    # 分片上传每片只有 8MB，但 complete/其它普通上传仍可能较大。
    client_max_body_size 2g;

    # gzip 对 SSE 有害（压缩缓冲会破坏逐 token 推送），
    # 所以只对静态资源开。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API（含 SSE 流式问答）----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清空 Connection 才能复用 keep-alive；SSE 需要长连接不被中间层截断。
        proxy_set_header Connection "";

        # **SSE 必须关缓冲**：否则用户会看到“等 5 秒后整段涌出”。
        proxy_buffering off;
        # 上传分片直接流给 API，避免 Nginx 先落盘再转发（2GB 文件会写两遍）。
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 双保险：即使某层代理仍开了 buffering，也认这个头。
        add_header X-Accel-Buffering no always;
    }

    # 健康检查与指标（运维/探针可直接访问）。
    location /health/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存；index.html 不缓存（发版后立即生效）。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
