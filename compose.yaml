# 企业级 RAG 平台 · Docker Compose 开发/演示栈
#
# ## 默认起哪些服务
#
#   postgres  pgvector/pg17（5433 → 宿主，避免与本机 PG 5432 冲突）
#   redis     Valkey 8（6380 → 宿主）
#   migrate   一次性迁移任务（完成后退出）
#   api       FastAPI + SSE（8000）
#   worker    解析/切分/向量化/索引任务
#   web       Vite 构建产物 + Nginx 反代（8080）
#
# 默认对象存储是本地卷（appstorage），不依赖 MinIO：
# 一键启动不应该被“某个镜像不在加速器白名单”阻塞。
# 需要验证 S3 适配层时用 --profile s3 + deploy/docker/compose.s3.yml。
#
# ## 为什么 DB/Redis 要映射到非默认端口
#
# 开发机通常已经有系统 PG(5432) / Redis(6379)。映射到 5433/6380 后，
# 容器与宿主可以并存，`make test-int` 仍连宿主，不互相踩。
#
# ## 可观测性（可选）
#
#   docker compose --profile observability up -d
#   → Prometheus :9090、Grafana :3000（自动导入 dashboard.json）
#
# ## GPU（已不再需要）
#
# 本地 embedding 已换成远程 OpenAI 兼容 API，镜像不再包含 torch/CUDA，
# 因此不再需要把 NVIDIA 设备透传进容器。若将来要接本地模型，
# 应作为独立的 provider 实现 + 单独的镜像，而不是让默认镜像背 2GB CUDA。
#
# ## 环境变量
#
# compose 会自动读取仓库根的 `.env` 做**变量插值**（不是注入容器）。
# 这里只引用 LLM key、JWT secret 等少量变量；数据库/Redis/存储的
# host 全部在下面硬编码为容器服务名，避免宿主 `.env` 里的 127.0.0.1
# 泄漏进容器导致“连到了宿主数据库”的事故。
#
# 生产不要把密码写在 compose 里：用 `docker compose --env-file` /
# Docker secrets / 平台密钥管理覆盖下面带默认值的变量。

name: enterprise-rag

x-python-image: &python-image
  image: enterprise-rag/python:local

x-python-build: &python-build
  context: .
  dockerfile: deploy/docker/python.Dockerfile
  # 构建期用宿主网络。
  #
  # 实测：同一个镜像源，容器桥接网络只命中 25~130KB/s 的 CDN 节点，
  # 而宿主网络能到 30MB/s（同一台机、同一分钟）。骨架里下载 100MB 依赖，
  # 差异是"十几分钟"与"十几小时"。构建阶段不需要隔离网络，
  # 运行期仍然是默认桥接网络。
  network: host
  args:
    # PyPI 镜像（可选）：国内直连 pypi.org 可能只有几百 B/s。
    # 在 .env 里写 PYPI_MIRROR / PIP_INDEX_URL 即可生效。
    PYPI_MIRROR: "${PYPI_MIRROR:-}"
    PIP_INDEX_URL: "${PIP_INDEX_URL:-}"
    # 可选：把镜像站 CDN 固定到某个快节点（国内 CDN 节点间速度差异极大）
    PYPI_MIRROR_IP: "${PYPI_MIRROR_IP:-}"

# API 与 Worker 共用的业务配置。
x-app-env: &app-env
  # ---- 运行环境 ----
  RAG_ENV: "local"
  RAG_DEBUG: "false"
  RAG_LOG_FORMAT: "json"
  RAG_STARTUP_DEPENDENCY_CHECK: "true"
  # 本地演示用：/api/v1/auth/dev-bootstrap 自动建租户并登录。
  # 生产必须设 false（Settings 的生产守卫也会拒绝 true）。
  RAG_DEV_AUTH_ENABLED: "true"
  RAG_IDENTITY__JWT_SECRET: "${RAG_IDENTITY__JWT_SECRET:-docker-local-dev-secret-change-me-32-chars}"

  # ---- PostgreSQL（容器内服务名，不是 127.0.0.1）----
  RAG_DATABASE__HOST: "postgres"
  RAG_DATABASE__PORT: "5432"
  RAG_DATABASE__NAME: "rag"
  RAG_DATABASE__USER: "rag_app"
  RAG_DATABASE__PASSWORD: "${RAG_APP_PASSWORD:-rag_local_dev_only}"
  # 迁移与 worker 跨租户认领需要高权限角色。
  # 开发环境 rag_admin 是超级用户；生产应拆成 migration / admin 两个角色。
  RAG_DATABASE__MIGRATION_USER: "rag_admin"
  RAG_DATABASE__MIGRATION_PASSWORD: "${POSTGRES_PASSWORD:-rag_local_dev_only}"
  RAG_DATABASE__ADMIN_USER: "rag_admin"
  RAG_DATABASE__ADMIN_PASSWORD: "${POSTGRES_PASSWORD:-rag_local_dev_only}"
  RAG_DATABASE__POOL_SIZE: "5"
  RAG_DATABASE__MAX_OVERFLOW: "5"

  # ---- Redis / Valkey ----
  RAG_REDIS__HOST: "redis"
  RAG_REDIS__PORT: "6379"

  # ---- 对象存储：默认本地卷（不依赖 MinIO，保证一键能起）----
  # 需要验证 S3 适配层时用 `--profile s3` + deploy/docker/compose.s3.yml。
  RAG_STORAGE__BACKEND: "local"
  RAG_STORAGE__LOCAL_ROOT: "/app/.data/storage"
  # 以下 S3 变量由 compose.s3.yml 覆盖时生效：
  # RAG_STORAGE__S3_*（见 deploy/docker/compose.s3.yml）

  # ---- LLM：key 从宿主 .env 或 shell 读取；为空时问答接口返回 503 ----
  RAG_LLM__PROVIDER: "${RAG_LLM__PROVIDER:-deepseek}"
  RAG_LLM__API_KEY: "${RAG_LLM__API_KEY:-}"
  RAG_LLM__BASE_URL: "${RAG_LLM__BASE_URL:-https://api.deepseek.com/v1}"
  RAG_LLM__CHAT_MODEL: "${RAG_LLM__CHAT_MODEL:-deepseek-v4-pro}"
  RAG_LLM__CHEAP_MODEL: "${RAG_LLM__CHEAP_MODEL:-deepseek-flash}"

  # ---- Embedding：智谱 OpenAI 兼容 /embeddings（远程）----
  #
  # 不再需要 torch / sentence-transformers / HF 模型缓存：
  # 本地 bge-m3 会拉 PyPI 的 CUDA 版 torch（含 nvidia-* ~2GB），
  # 而推理跑在 CPU 上——构建慢且镜像巨大。
  # 换供应商只改这几行（任何提供 /embeddings 的服务都可以）。
  RAG_EMBEDDING__PROVIDER: "${RAG_EMBEDDING__PROVIDER:-zhipu}"
  RAG_EMBEDDING__MODEL_NAME: "${RAG_EMBEDDING__MODEL_NAME:-embedding-3}"
  RAG_EMBEDDING__DIMENSION: "1024"
  RAG_EMBEDDING__BASE_URL: "${RAG_EMBEDDING__BASE_URL:-https://open.bigmodel.cn/api/paas/v4}"
  # key 只从宿主 .env / shell 读，不写默认值（不能把密钥提交进仓库）
  RAG_EMBEDDING__API_KEY: "${RAG_EMBEDDING__API_KEY:-}"
  RAG_EMBEDDING__BATCH_SIZE: "32"
  RAG_EMBEDDING__MAX_CONCURRENCY: "4"

  # ---- 检索链路 ----
  RAG_RETRIEVAL__USE_KEYWORD: "true"
  RAG_RETRIEVAL__USE_REWRITE: "true"
  # 重排：SiliconFlow 的 Cohere 风格 /rerank（换家只改 base_url + model）
  RAG_RETRIEVAL__USE_RERANK: "${RAG_RETRIEVAL__USE_RERANK:-true}"
  RAG_RETRIEVAL__USE_SELF_CHECK: "false"
  RAG_RERANKER__PROVIDER: "${RAG_RERANKER__PROVIDER:-siliconflow}"
  RAG_RERANKER__MODEL_NAME: "${RAG_RERANKER__MODEL_NAME:-Qwen/Qwen3-Reranker-4B}"
  RAG_RERANKER__BASE_URL: "${RAG_RERANKER__BASE_URL:-https://api.siliconflow.cn/v1}"
  # key 只从宿主 .env / shell 读（不要提交进仓库）
  RAG_RERANKER__API_KEY: "${RAG_RERANKER__API_KEY:-}"
  RAG_RERANKER__BATCH_SIZE: "8"
  RAG_RERANKER__MAX_CONCURRENCY: "2"

  # Worker 指标端口（Prometheus 抓取 worker:9101/metrics）。
  # API 与迁移不使用这个变量，但共用同一份环境，设了也无害。
  RAG_WORKER__METRICS_PORT: "9101"
  RAG_WORKER__METRICS_HOST: "0.0.0.0"

  # ---- 链路追踪（Langfuse，可选）----
  # 默认关闭：没起 `--profile langfuse` 时开启只会持续发送失败、
  # 在日志里刷 warning。`make lf-up` 会把它置 true 并重建 api/worker。
  #
  # host 用容器服务名（不是 localhost）：容器里的 localhost 是它自己。
  # 端口 3030 是映射到宿主的端口，容器内 Langfuse 仍监听 3000。
  RAG_TRACING__ENABLED: "${RAG_TRACING__ENABLED:-false}"
  RAG_TRACING__HOST: "http://langfuse-web:3000"
  RAG_TRACING__PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}"
  RAG_TRACING__SECRET_KEY: "${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}"
  RAG_TRACING__ENVIRONMENT: "local"
  RAG_TRACING__SAMPLE_RATE: "1.0"

# Langfuse v3 自托管所需的全部环境。web 与 worker 共用。
#
# v3 的架构是：Postgres（元数据）+ ClickHouse（事件）+ Redis（队列）
# + S3（事件块）。少了任何一项都起不来，且报错往往在 worker 里。
x-langfuse-env: &langfuse-env
  DATABASE_URL: "postgresql://rag_admin:${POSTGRES_PASSWORD:-rag_local_dev_only}@postgres:5432/langfuse"
  # 以下三个是会话/加密用途的静态密钥，开发默认值不得用于生产。
  SALT: "${LANGFUSE_SALT:-rag-local-salt-change-me}"
  ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
  NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-rag-local-nextauth-change-me}"
  NEXTAUTH_URL: "http://localhost:3030"
  TELEMETRY_ENABLED: "false"

  CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
  CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
  CLICKHOUSE_USER: "clickhouse"
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-rag_clickhouse_dev}"
  CLICKHOUSE_CLUSTER_ENABLED: "false"

  REDIS_CONNECTION_STRING: "redis://redis:6379"

  # 事件块存储：用 SeaweedFS 做 S3 兼容层。
  # 为什么不用 MinIO：本机的镜像加速器把 `minio/*` 列入黑名单（denied），
  # 一条命令起不来的开发栈没有意义。
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "${LANGFUSE_S3_ACCESS_KEY_ID:-raglangfuse}"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_S3_SECRET_ACCESS_KEY:-raglangfuse123}"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://langfuse-seaweedfs:8333"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: "langfuse"
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: "us-east-1"
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: "${LANGFUSE_S3_ACCESS_KEY_ID:-raglangfuse}"
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_S3_SECRET_ACCESS_KEY:-raglangfuse123}"
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "http://langfuse-seaweedfs:8333"
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

  # 首次启动自动创建组织/项目/账号，并**固定** API key，
  # 这样 compose 里的 RAG_TRACING__* 不需要人工去 UI 里抄。
  LANGFUSE_INIT_ORG_ID: "rag-local"
  LANGFUSE_INIT_ORG_NAME: "RAG Local"
  LANGFUSE_INIT_PROJECT_ID: "rag-local"
  LANGFUSE_INIT_PROJECT_NAME: "RAG Platform"
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}"
  LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}"
  LANGFUSE_INIT_USER_EMAIL: "${LANGFUSE_ADMIN_EMAIL:-admin@rag.local}"
  LANGFUSE_INIT_USER_NAME: "Admin"
  LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_ADMIN_PASSWORD:-raglangfuse123}"

services:
  # ------------------------------------------------------------------ 依赖
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: "rag_admin"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rag_local_dev_only}"
      POSTGRES_DB: "rag"
      # 供初始化脚本创建受 RLS 约束的应用角色。
      RAG_APP_ROLE: "rag_app"
      RAG_APP_PASSWORD: "${RAG_APP_PASSWORD:-rag_local_dev_only}"
    ports:
      # 刻意避开宿主默认 5432（开发机通常已有系统 PG）。
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_admin -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    # 可选：`docker compose --profile s3 up -d`
    # 默认本地存储不需要它；见 deploy/docker/README.md 第 7 节。
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-ragminio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-ragminio123}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-ragminio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-ragminio123}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio...";
          sleep 2;
        done
        mc mb --ignore-existing local/rag-documents
        mc anonymous set none local/rag-documents
        echo "minio bucket ready"
    restart: "no"

  # ------------------------------------------------------------------ 迁移
  migrate:
    <<: *python-image
    build: *python-build
    command: ["alembic", "-c", "/app/packages/db/alembic.ini", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------ 应用
  api:
    <<: *python-image
    build: *python-build
    command:
      - uvicorn
      - --factory
      - rag_api.main:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment: *app-env
    ports:
      # 本机开发服务（uvicorn）通常占用 8000，这里映射到 8010 避免冲突。
      # 容器内仍是 8000；Web 的 Nginx 通过服务名 api:8000 反代。
      - "8010:8000"
    volumes:
      - appstorage:/app/.data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    <<: *python-image
    command: ["python", "-m", "rag_worker"]
    environment: *app-env
    # 指标端口只对容器网络开放（Prometheus 抓 worker:9101）。
    # 不映射到宿主：多副本 `--scale worker=N` 时宿主端口会冲突，
    # 且指标不应暴露到公网。排障用 `docker compose exec worker ...`。
    expose:
      - "9101"
    volumes:
      - appstorage:/app/.data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # worker 收到 SIGTERM 后等当前批次结束；给编排器留足优雅退出时间。
    stop_grace_period: 60s
    restart: unless-stopped

  web:
    image: enterprise-rag/web:local
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      # 同 Python 镜像：构建期走宿主网络，避免 npm 源被慢节点拖死
      network: host
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ 可观测性（可选）
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./deploy/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # ------------------------------------------------------------------ Langfuse（可选）
  #
  # `docker compose --profile langfuse up -d` 或 `make lf-up`。
  # 宿主端口 3030（刻意避开 Grafana 的 3000）。
  langfuse-seaweedfs:
    image: chrislusf/seaweedfs:latest
    profiles: ["langfuse"]
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - langfuse-blobs:/data
      - ./deploy/docker/langfuse/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  # 建 bucket。SeaweedFS 对 Admin 身份也会在 PutObject 时自动建桶，
  # 但 Langfuse 启动时会先探测桶，桶不存在会直接报错退出，
  # 所以这里显式建一次（幂等：已存在返回 409，视为成功）。
  langfuse-bucket-init:
    image: chrislusf/seaweedfs:latest
    profiles: ["langfuse"]
    depends_on:
      - langfuse-seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -s -o /dev/null --max-time 2 http://langfuse-seaweedfs:8333/; do
          echo "waiting for seaweedfs s3..."; sleep 2;
        done
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
          --aws-sigv4 'aws:amz:us-east-1:s3' \
          --user "$${S3_ACCESS_KEY}:$${S3_SECRET_KEY}" \
          http://langfuse-seaweedfs:8333/langfuse);
        echo "bucket create -> HTTP $$code";
        case "$$code" in 200|409) exit 0;; *) exit 1;; esac
    environment:
      S3_ACCESS_KEY: "${LANGFUSE_S3_ACCESS_KEY_ID:-raglangfuse}"
      S3_SECRET_KEY: "${LANGFUSE_S3_SECRET_ACCESS_KEY:-raglangfuse123}"
    restart: "no"

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.12
    profiles: ["langfuse"]
    environment:
      CLICKHOUSE_USER: "clickhouse"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-rag_clickhouse_dev}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - langfuse-chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # 在业务 PG 里建一个独立 database（不是独立 schema）：
  # Langfuse 自己的迁移与业务迁移互不影响，且少起一个 PG 实例。
  # 生产建议用独立实例（隔离故障域与备份策略）。
  langfuse-db-init:
    image: pgvector/pgvector:pg17
    profiles: ["langfuse"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:-rag_local_dev_only}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until pg_isready -h postgres -U rag_admin -d postgres; do sleep 2; done
        if psql -h postgres -U rag_admin -d postgres -tAc \
             "SELECT 1 FROM pg_database WHERE datname='langfuse'" | grep -q 1; then
          echo "database langfuse already exists";
        else
          psql -h postgres -U rag_admin -d postgres -c 'CREATE DATABASE langfuse';
        fi
    restart: "no"

  langfuse-web:
    image: langfuse/langfuse:3
    profiles: ["langfuse"]
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
      langfuse-clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment: *langfuse-env
    ports:
      # 宿主 3030：Grafana 已占 3000，撞了会导致追踪静默失效。
      - "3030:3000"
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    profiles: ["langfuse"]
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-bucket-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment: *langfuse-env
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  appstorage:
  promdata:
  grafanadata:
  langfuse-blobs:
  langfuse-chdata:
