# CI 门禁：静态检查 + 单测 + 集成测 + 契约漂移 + 回归。
#
# ## 为什么要分 job 而不是一个长脚本
#
# 分 job 的价值在**失败定位**：一个 job 红了能立刻知道是哪一层坏了。
# 合并成一个脚本时，"第 47 行失败"要人往回翻。
#
# ## 为什么集成测需要 services
#
# 集成测连真实 PG（含 pgvector）与 Redis。用 GitHub Actions 的
# `services` 起容器，而不是 mock —— mock 测不到 RLS、HNSW 索引、
# 并发认领这些"由数据库实现保证"的行为。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 集成测的凭据。CI 环境里这些是临时容器的密码，
  # 与生产无关（生产走密钥管理）。
  RAG_DATABASE__HOST: 127.0.0.1
  RAG_DATABASE__PORT: 5432
  RAG_DATABASE__USER: rag_app
  RAG_DATABASE__PASSWORD: ci-only-password
  RAG_DATABASE__NAME: rag
  RAG_DATABASE__MIGRATION_USER: rag_admin
  RAG_DATABASE__MIGRATION_PASSWORD: ci-only-password
  RAG_DATABASE__ADMIN_USER: rag_admin
  RAG_DATABASE__ADMIN_PASSWORD: ci-only-password
  RAG_REDIS__HOST: 127.0.0.1
  RAG_REDIS__PORT: 6379
  RAG_ENV: local

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-extras
      - name: ruff
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: 契约产物未漂移
        # 改了 Pydantic schema 却没跑 gen-contracts 时失败。
        # 这是"前端类型漂移"的唯一自动防线（AGENTS.md 4.3）。
        run: uv run python packages/contracts/scripts/check_contracts_fresh.py

  unit:
    name: 单测（无外部依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - run: uv run pytest -q -m "not integration"

  integration:
    name: 集成测（真实 PG + Redis）
    runs-on: ubuntu-latest
    services:
      postgres:
        # 必须用带 pgvector 的镜像：普通 postgres 缺 vector 扩展，
        # chunks 表建不出来。
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - name: 建运行角色 + 扩展
        # 生产是三个角色（migration/admin/app），CI 里也要建，
        # 否则 RLS 相关的集成测跑不了（superuser 会绕过 RLS）。
        run: |
          PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U rag_admin -d rag -c "
            CREATE ROLE rag_app LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOBYPASSRLS;
            CREATE EXTENSION IF NOT EXISTS vector;
          "
      - name: 跑迁移
        run: uv run alembic -c packages/db/alembic.ini upgrade head
      - run: uv run pytest -q -m integration

  docker:
    name: Docker 配置校验
    runs-on: ubuntu-latest
    # 只校验 compose 语法/变量插值/锚点合并，不构建镜像：
    # 构建需要下载 torch（数 GB），不适合每个 PR 都跑。
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        run: docker compose config --quiet

  regression:
    name: 离线回归（需已建库）
    runs-on: ubuntu-latest
    # 依赖真实数据库 + embedding 模型。CI 里没有 GPU，
    # 本地 bge-m3 会退化为 CPU（慢但可用）。
    # **这一层需要预置评估库**，CI 首次运行会 skip（无基线）。
    if: false   # 默认关闭：需要 GPU/预置语料，在专用 runner 上跑
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - run: uv run python scripts/check_regression.py --baseline baseline-30
