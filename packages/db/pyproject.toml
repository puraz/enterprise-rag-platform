[project]
name = "rag-db"
version = "0.1.0"
description = "ORM 模型 / 仓储(SQL) / Alembic 迁移：api 与 worker 共用的数据访问层"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-contracts",
    "rag-core",
    # ORM 与迁移。api/worker 只依赖本包，不直接依赖 sqlalchemy 做业务查询
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "pgvector>=0.3",
]

[tool.uv.sources]
rag-contracts = { workspace = true }
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_db"]
