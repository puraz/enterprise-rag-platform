# Alembic 配置。
#
# 唯一真相是 `packages/db/alembic/env.py`：它从 rag_core 的 Settings 读 DSN，
# 所以这里**故意不写 sqlalchemy.url**——写死的话会绕开 .env 与生产守卫，
# 出现"迁移连到了与 API 不同的库"这种最难查的事故。
#
# 迁移脚本放在 packages/db/alembic/versions，全项目唯一一处。

[alembic]
# 相对本文件路径，Alembic 用 %(here)s 解析
script_location = %(here)s/alembic

# 迁移文件名：日期前缀 + 序号 + 描述，便于按时间顺序阅读
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 生成迁移时把仓库根加入 sys.path，才能 import rag_db / rag_core
prepend_sys_path = .
path_separator = os

# 迁移文件中的时区
timezone = UTC

# 生成迁移时截断 slug 长度，避免文件名过长
truncate_slug_length = 48

# 不在生成迁移时跑环境（减少意外连库）
revision_environment = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
