[project]
name = "enterprise-rag-platform"
version = "0.0.0"
description = "企业级多租户 RAG 平台 Monorepo（uv workspace 根）"
requires-python = ">=3.12,<3.13"
dependencies = []

# 根工程只是 workspace 宿主 + 工具链配置的家，本身不是要发布的包。
# 不写这行 uv 会尝试构建根目录并要求有可导入的模块。
[tool.uv]
package = false

[tool.uv.workspace]
# packages/* 是共享库，apps/* 是可独立部署的端；两边都是 workspace 成员。
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "alembic>=1.20.1",
    "fpdf2>=2.8",
    "python-docx>=1.1",
]

# ------------------------------- ruff -------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# 显式列出，避免 glob 在 ruff 各版本行为差异；影响 isort 的第一方包判定
src = [
    "packages/core/src",
    "packages/contracts/src",
    "packages/db/src",
    "packages/adapters/src",
    "apps/api/src",
    "apps/worker/src",
    "tests",
]

[tool.ruff.lint]
# E/W pycodestyle | F pyflakes | I isort | N pep8-naming | UP pyupgrade
# B bugbear | SIM simplify | ASYNC 异步误用 | S bandit 安全 | RUF ruff 自有规则
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # 测试里断言就是要用 assert
    # 本项目硬性要求中文注释/文档字符串，中文标点（：（）「」）是正确写法，
    # 不能为了通过 lint 把中文改成半角。这三条规则只对纯英文项目有意义。
    "RUF001",  # 字符串里的歧义 Unicode 字符
    "RUF002",  # docstring 里的歧义 Unicode 字符
    "RUF003",  # 注释里的歧义 Unicode 字符
]

# Alembic 自动生成的迁移文件由生成器决定格式，ruff format 不参与，
# 否则每次 autogenerate 都要手工重新格式化，且两者会反复互相覆盖。
[tool.ruff.format]
exclude = ["packages/db/alembic/versions/*.py"]

[tool.ruff.lint.isort]
known-first-party = ["rag_core", "rag_contracts", "rag_db", "rag_adapters", "rag_api", "rag_worker"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # 测试 fixture 里的假密码/假 token 不算泄密
# Alembic 自动生成的迁移文件：不手改（改了会与生成器逻辑冲突，
# 下次 autogenerate 覆盖），因此不对其做格式/行长要求。
"packages/db/alembic/versions/*.py" = ["E501", "W291", "I001"]
# 错误码枚举的成员名含 TOKEN（AUTH_TOKEN_EXPIRED 等），
# bandit 的 S105 会把它误判成硬编码密码。这些是契约常量，不是密钥。
"packages/contracts/src/rag_contracts/errors/codes.py" = ["S105"]
# FastAPI 的依赖/参数声明必须在函数签名默认值里调用（Query/Depends），
# 这是框架的设计，不是代码异味。
"apps/api/src/rag_api/api/**" = ["B008"]
"apps/api/src/rag_api/deps/**" = ["B008"]
# 枚举包同理：ConfidentialityLevel.SECRET = "secret" 是密级常量，
# 不是密码。按文件豁免（范围比按规则全局豁免窄得多）。
"packages/contracts/src/rag_contracts/enums/*.py" = ["S105"]

# ------------------------------- mypy -------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
files = ["packages", "apps"]
mypy_path = [
    "packages/core/src",
    "packages/contracts/src",
    "packages/db/src",
    "packages/adapters/src",
    "apps/api/src",
    "apps/worker/src",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# 解析/OCR 相关库缺类型存根。它们都有运行时校验兜底（try/except + 能力检测），
# 且调用点集中在 parsers/ 内，风险可控。
[[tool.mypy.overrides]]
module = [
    "pymupdf.*",
    "fitz.*",
    "docx2txt.*",
    "pptx.*",
    "openpyxl.*",
    "pytesseract.*",
    "docx.*",
]
ignore_missing_imports = true

# ----------------------------- pytest -------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 显式指定，否则 pytest-asyncio 会发弃用警告且未来默认行为会变
asyncio_default_fixture_loop_scope = "function"
# --strict-markers 要求所有 marker 必须在此登记，写错 marker 名会直接报错
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: 需要真实 PG/Redis 的测试，用 -m integration 单独跑",
    "concurrency: 并发安全专项测试，用 -m concurrency 单独跑",
    "slow: 耗时较长的测试",
]

[tool.coverage.run]
source = ["packages", "apps"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
