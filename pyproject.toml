[project]
name = "enterprise-rag-platform"
version = "0.0.0"
description = "企业级多租户 RAG 平台 Monorepo（uv workspace 根）"
requires-python = ">=3.12,<3.13"
dependencies = []

# 根工程只是 workspace 宿主 + 工具链配置的家，本身不是要发布的包。
# 不写这行 uv 会尝试构建根目录并要求有可导入的模块。
[tool.uv]
package = false

[tool.uv.workspace]
# packages/* 是共享库，apps/* 是可独立部署的端；两边都是 workspace 成员。
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

# ------------------------------- ruff -------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# 显式列出，避免 glob 在 ruff 各版本行为差异；影响 isort 的第一方包判定
src = ["packages/core/src", "packages/contracts/src", "apps/api/src", "apps/worker/src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle | F pyflakes | I isort | N pep8-naming | UP pyupgrade
# B bugbear | SIM simplify | ASYNC 异步误用 | S bandit 安全 | RUF ruff 自有规则
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # 测试里断言就是要用 assert
    # 本项目硬性要求中文注释/文档字符串，中文标点（：（）「」）是正确写法，
    # 不能为了通过 lint 把中文改成半角。这三条规则只对纯英文项目有意义。
    "RUF001",  # 字符串里的歧义 Unicode 字符
    "RUF002",  # docstring 里的歧义 Unicode 字符
    "RUF003",  # 注释里的歧义 Unicode 字符
]

[tool.ruff.lint.isort]
known-first-party = ["rag_core", "rag_contracts", "rag_api", "rag_worker"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # 测试 fixture 里的假密码/假 token 不算泄密

# ------------------------------- mypy -------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
files = ["packages", "apps"]
mypy_path = ["packages/core/src", "packages/contracts/src", "apps/api/src", "apps/worker/src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ----------------------------- pytest -------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 显式指定，否则 pytest-asyncio 会发弃用警告且未来默认行为会变
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["packages", "apps"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
