[project]
name = "rag-worker"
version = "0.1.0"
description = "Worker 端：解析 / 切分 / 向量化 / 索引重建 / 定时任务（独立进程、独立扩缩容）"
requires-python = ">=3.12,<3.13"
# 端边界第一层：这里故意不写 rag-api。生产镜像里它物理不存在。
dependencies = [
    "rag-core",
    "rag-contracts",
]

# 同上：显式声明本地 workspace 来源，不依赖各版本不一致的自动推断。
[tool.uv.sources]
rag-core = { workspace = true }
rag-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_worker"]
