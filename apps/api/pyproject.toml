[project]
name = "rag-api"
version = "0.1.0"
description = "API 端：用户面 /api/v1 + 管理面 /api/v1/admin（无状态多副本）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-core",
    "rag-contracts",
]

# 告诉 uv：这两个依赖来自同 workspace 的本地目录，不要跑去 PyPI 找。
# 显式声明比依赖自动推断可靠——推断规则各版本行为不一致，写死最稳。
[tool.uv.sources]
rag-core = { workspace = true }
rag-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]
