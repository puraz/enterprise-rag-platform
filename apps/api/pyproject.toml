[project]
name = "rag-api"
version = "0.1.0"
description = "API 端：用户面 /api/v1 + 管理面 /api/v1/admin（无状态多副本）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-core",
    "rag-contracts",
    # api 通过仓储层访问数据，不直接写 SQL
    "rag-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "boto3>=1.35",
    "types-boto3>=1.35",
    "cryptography>=43",
    "python-multipart>=0.0.20",
    "langchain-community>=0.3",
    "pypdf>=5.0",
    "pymupdf>=1.24",
    "docx2txt>=0.8",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

# 告诉 uv：这些依赖来自同 workspace 的本地目录，不要跑去 PyPI 找。
# 显式声明比依赖自动推断可靠——推断规则各版本行为不一致，写死最稳。
[tool.uv.sources]
rag-core = { workspace = true }
rag-contracts = { workspace = true }
rag-db = { workspace = true }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]
