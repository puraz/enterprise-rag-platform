[project]
name = "rag-api"
version = "0.1.0"
description = "API 端：用户面 /api/v1 + 管理面 /api/v1/admin（无状态多副本）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-core",
    "rag-contracts",
    # api 通过仓储层访问数据，不直接写 SQL
    "rag-db",
    # 解析/存储/Provider 已下沉到共享包（worker 也要用），api 只保留业务编排
    "rag-adapters",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "cryptography>=43",
    "python-multipart>=0.0.20",
]

# 告诉 uv：这些依赖来自同 workspace 的本地目录，不要跑去 PyPI 找。
# 显式声明比依赖自动推断可靠——推断规则各版本行为不一致，写死最稳。
[tool.uv.sources]
rag-core = { workspace = true }
rag-contracts = { workspace = true }
rag-db = { workspace = true }
rag-adapters = { workspace = true }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]
